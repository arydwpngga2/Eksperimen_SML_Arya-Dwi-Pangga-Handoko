name: Data Preprocessing

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: |
          pip install pandas
          pip install scikit-learn

      - run: |
          cd preprocessing
          python automate_Arya-Dwi-Pangga-Handoko.py